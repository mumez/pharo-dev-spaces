[project]
name = "pharo-dev-spaces"
version = "0.1.0"
description = "Disposable Pharo images and daily snapshots for AI coding agents"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pds = "pds.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pds"]

[tool.pytest.ini_options]
addopts = "-m 'not pharo'"
markers = ["pharo: integration tests that launch a real Pharo VM (run with -m pharo)"]
