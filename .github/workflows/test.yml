name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Lint
        run: |
          uvx ruff@0.17.1 check .
          uvx ruff@0.17.1 format --check .
      - name: Unit tests
        run: uv run --locked pytest
